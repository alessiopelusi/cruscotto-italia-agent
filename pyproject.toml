[project]
name = "cruscotto-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Alessio Pelusi", email = "alessio3pelusi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.2",
